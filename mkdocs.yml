site_name: EdTech Policy Framework
site_description: Policy design, governance, compliance and implementation guidance for educational technology, with a technology-evaluation rubric scorer.
site_url: https://freddricklogan.github.io/EdTech-Policy-Framework/
copyright: Freddrick Logan
strict: true
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
nav:
  - Overview: index.md
  - Framework:
      - Policy design: policy-design-framework.md
      - Governance structure: governance-structure.md
      - Compliance framework: compliance-framework.md
      - Implementation guide: implementation-guide.md
      - Technology evaluation rubric: technology-evaluation-rubric.md
  - Tools:
      - Rubric scorer: tools/rubric.md
  - Case study: CASE_STUDY.md
extra_css:
  - assets/shell/exec-shell.css
  - assets/site.css
extra_javascript:
  - path: assets/site.js
    type: module
  - path: assets/rubric-page.js
    type: module
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
